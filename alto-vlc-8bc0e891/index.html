<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Répétition</title>
<link rel="stylesheet" href="page.css" />
</head>
<body>
<!-- Structure commune des pages de répétition (modèle du 23 octobre 2026). Le contenu vient de donnees.json. -->
<header class="page-head">
  <p class="page-kicker" id="page-kicker"></p>
  <h1 id="page-title"></h1>
</header>

<div class="sound-bar" role="group" aria-label="Son">
  <label class="field">
    <span>Son</span>
    <select id="timbre"></select>
  </label>
  <div class="field">
    <span>Bourdon</span>
    <span class="segmented" role="group" aria-label="Notes du bourdon">
      <button type="button" data-drone-fifth="true" aria-pressed="true">Tonique + quinte</button>
      <button type="button" data-drone-fifth="false" aria-pressed="false">Tonique seule</button>
    </span>
  </div>
  <div class="field">
    <span>Octave</span>
    <span class="segmented" role="group" aria-label="Octave du bourdon et des notes" id="registers"></span>
  </div>
  <label class="field">
    <span>Volume du bourdon</span>
    <input id="drone-volume" type="range" min="0" max="100" value="70" />
  </label>
  <label class="field">
    <span>Volume des notes</span>
    <input id="notes-volume" type="range" min="0" max="100" value="70" />
  </label>
  <button type="button" class="stop-all" id="stop-all">Tout arrêter</button>
  <p class="sound-status" id="sound-status" aria-live="polite"></p>
</div>

<main>
  <section aria-labelledby="listen-title">
    <h2 id="listen-title">1. Écouter</h2>
    <div class="players" id="players"></div>
  </section>

  <section aria-labelledby="reference-title">
    <h2 id="reference-title">2. Référence</h2>
    <p class="help" id="help"></p>
    <div id="reference"></div>
  </section>

  <section aria-labelledby="tetrachords-title">
    <h2 id="tetrachords-title">3. Tétracordes</h2>
    <p class="help">En couleur : les notes absentes de la référence.</p>
    <div class="cards" id="tetrachords"></div>
  </section>
</main>

<script src="moteur.js"></script>
<script src="page.js"></script>
</body>
</html>
